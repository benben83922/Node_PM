name: WBS → Supabase Sync

on:
  push:
    branches: [main]
    paths:
      - "**/WBS.md"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements_supabase.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements_supabase.txt

      - name: Run parser tests
        run: python -m pytest scripts/test_sync_parser.py -v

      - name: Sync WBS to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/sync_wbs_to_supabase.py
